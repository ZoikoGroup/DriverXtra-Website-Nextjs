name: Deploy driverxtra

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-driverxtra
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Configure SSH
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_SSH_KEY_B64: ${{ secrets.VM_SSH_KEY_B64 }}
        run: |
          mkdir -p ~/.ssh
          echo "$VM_SSH_KEY_B64" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts

      - name: Sync files to VM
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        # tar over ssh instead of rsync, so the VM needs nothing beyond a standard shell.
        # Files are unpacked into a fresh folder, server-only files (.env, node_modules, …)
        # are carried over, then the folders are swapped — same result as rsync --delete.
        run: |
          tar -czf - \
            --exclude=./node_modules --exclude=./.git --exclude=./.github \
            --exclude='./.env*' --exclude=./.deployed-lock --exclude=./.next/cache \
            . | ssh "$VM_USER@$VM_HOST" 'set -e
              rm -rf ~/driverxtra.new ~/driverxtra.old
              mkdir -p ~/driverxtra ~/driverxtra.new
              tar -xzf - -C ~/driverxtra.new
              cd ~/driverxtra
              for f in node_modules .deployed-lock .next/cache .env*; do
                if [ -e "$f" ]; then
                  mkdir -p "$(dirname ~/driverxtra.new/"$f")"
                  mv "$f" ~/driverxtra.new/"$f"
                fi
              done
              cd ~
              mv ~/driverxtra ~/driverxtra.old
              mv ~/driverxtra.new ~/driverxtra
              rm -rf ~/driverxtra.old'

      - name: Install deps if changed and restart
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          ssh "$VM_USER@$VM_HOST" 'set -e
            cd ~/driverxtra
            if ! cmp -s package-lock.json .deployed-lock; then
              npm ci
              cp package-lock.json .deployed-lock
            fi
            pm2 restart driverxtra --update-env
            pm2 save'

      - name: Health check
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          sleep 8
          ssh "$VM_USER@$VM_HOST" 'curl -fsI http://localhost:3001 | head -1'
